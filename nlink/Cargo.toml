[package]
name = "nlink"
version = "0.5.0"
description = "nlink-ng: native Qt 6 linking program for the TI-Nspire"
authors = [
  "Ben Schattinger <developer@lights0123.com>",
  "Ryan <ryan@freyja.pw>",
]
license = "GPL-3.0"
repository = "https://github.com/RyanHakurei/nlink-ng"
edition = "2021"

[lib]
name = "nlink"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
flate2 = "1"
indicatif = "0.17"
libc = "0.2"
libnspire = "0.2.3"
rusb = "0.6.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tar = "0.4"
