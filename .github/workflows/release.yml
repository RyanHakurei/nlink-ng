name: publish
on:
  push:
    branches:
      - release

jobs:
  publish:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
      - name: install Qt and libusb
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ qt6-base-dev libgl1-mesa-dev libusb-1.0-0-dev pkg-config
      - name: build
        run: |
          cmake -S qt -B qt/build -DCMAKE_BUILD_TYPE=Release
          cmake --build qt/build
      - name: upload binary
        uses: actions/upload-artifact@v4
        with:
          name: nlink-ng-linux
          path: qt/build/n-link
